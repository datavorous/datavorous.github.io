site_name: "datavorous"

theme:
  name: "material"
  logo: "assets/images/logo.png"
  # favicon: "assets/images/logo.png"
  language: "en"
  palette:
    - scheme: default
      primary: "white"
      accent: "indigo"
      toggle:
        icon: "material/brightness-7"
        name: "Switch to dark mode"
    - scheme: slate
      primary: "black"
      accent: "black"
      toggle:
        icon: "material/brightness-4"
        name: "Switch to light mode"
  font:
    text: "Google Sans"
    code: "JetBrains Mono"
  features:
    # - navigation.instant
    # - navigation.tabs
    - toc.integrate
    - content.code.annotate

nav:
  - Home: index.md
  - Guides:
      - Coding : guides/coding.md
  - Blogs:
      - The Woe Machine Halts: blogs/woe-machine.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/datavorous
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/datavorous314

plugins:
  - mermaid2:
      javascript: https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: vegalite
          class: vegalite
          format: !!python/name:mkdocs_charts_plugin.fences.fence_vegalite
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

extra_javascript:
  - https://cdn.jsdelivr.net/npm/vega@5
  - https://cdn.jsdelivr.net/npm/vega-lite@5
  - https://cdn.jsdelivr.net/npm/vega-embed@6

extra_css:
  - assets/custom.css

use_directory_urls: false
